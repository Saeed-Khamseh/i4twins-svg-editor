<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Unit 100  Cooling Line</title>

  <defs>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <text
    id="diagram-title"
    x="24"
    y="36"
    font-family="Segoe UI, Roboto, sans-serif"
    font-size="20"
    font-weight="500"
    fill="#3d4451"
  >
    Unit 100  Cooling Line
  </text>

  <g id="tank-t100">
    <rect
      id="tank-body"
      x="40"
      y="80"
      width="100"
      height="200"
      rx="12"
      ry="12"
      fill="url(#tankGrad)"
      stroke="#4a5568"
      stroke-width="2"
    />
    <text
      id="tank-label-1"
      x="90"
      y="175"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="12"
      fill="#2d3748"
    >
      TANK
    </text>
    <text
      id="tank-label-2"
      x="90"
      y="192"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="12"
      fill="#2d3748"
    >
      T-100
    </text>
  </g>

  <g id="pipelines" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round">
    <line id="pipe-1" x1="140" y1="180" x2="195" y2="180" />
    <line id="pipe-2" x1="265" y1="180" x2="320" y2="180" />
    <path id="pipe-3" d="M 375 180 L 500 180 L 500 300 L 430 300" />
  </g>

  <g id="pump-p101">
    <circle
      id="pump-p101-body"
      cx="230"
      cy="180"
      r="28"
      fill="#ffffff"
      stroke="#4a5568"
      stroke-width="2"
    />
    <path id="pump-p101-impeller" d="M 218 180 L 242 168 L 242 192 Z" fill="#2c5282" />
    <text
      id="pump-p101-label"
      x="230"
      y="230"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="11"
      fill="#2d3748"
    >
      PUMP P-101
    </text>
  </g>

  <g id="pump-p102">
    <circle
      id="pump-p102-body"
      cx="350"
      cy="180"
      r="28"
      fill="#ffffff"
      stroke="#4a5568"
      stroke-width="2"
    />
    <path id="pump-p102-impeller" d="M 338 180 L 362 168 L 362 192 Z" fill="#2c5282" />
    <text
      id="pump-p102-label"
      x="350"
      y="230"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="11"
      fill="#2d3748"
    >
      PUMP P-102
    </text>
  </g>

  <g id="compressor-c301">
    <rect
      id="compressor-body"
      x="580"
      y="60"
      width="90"
      height="50"
      rx="8"
      ry="8"
      fill="#e2e8f0"
      stroke="#4a5568"
      stroke-width="2"
    />
    <text
      id="compressor-label"
      x="625"
      y="90"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="11"
      fill="#2d3748"
    >
      COMP C-301
    </text>
  </g>

  <g id="valve-v110">
    <path
      id="valve-body"
      d="M 280 340 L 310 320 L 340 340 L 310 360 Z"
      fill="#ffffff"
      stroke="#4a5568"
      stroke-width="2"
    />
    <line id="valve-stem" x1="310" y1="320" x2="310" y2="360" stroke="#4a5568" stroke-width="2" />
    <text
      id="valve-label"
      x="310"
      y="385"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="11"
      fill="#2d3748"
    >
      VALVE V-110
    </text>
  </g>

  <g id="fan-f201">
    <circle id="fan-body" cx="620" cy="360" r="36" fill="#ffffff" stroke="#4a5568" stroke-width="2" />
    <path id="fan-blade-1" d="M 620 360 L 620 330 A 30 30 0 0 1 646 378 Z" fill="#718096" />
    <path id="fan-blade-2" d="M 620 360 L 646 378 A 30 30 0 0 1 594 378 Z" fill="#a0aec0" />
    <path id="fan-blade-3" d="M 620 360 L 594 378 A 30 30 0 0 1 594 342 Z" fill="#4a5568" />
    <path id="fan-blade-4" d="M 620 360 L 594 342 A 30 30 0 0 1 646 330 Z" fill="#cbd5e0" />
    <circle id="fan-hub" cx="620" cy="360" r="6" fill="#2d3748" />
    <text
      id="fan-label"
      x="620"
      y="415"
      text-anchor="middle"
      font-family="Segoe UI, Roboto, sans-serif"
      font-size="11"
      fill="#2d3748"
    >
      FAN F-201
    </text>
  </g>

  <circle id="indicator-sensor" cx="480" cy="340" r="10" fill="#f6ad55" stroke="#c05621" stroke-width="1.5" />
</svg>
